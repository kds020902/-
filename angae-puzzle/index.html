<title>안개곶 퍼즐 수첩</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@400;700&family=Gowun+Dodum&family=Hahmlet:wght@500;700;800&display=swap">
<style>
/* Layout: a harbor-town puzzle notebook. One column on phones; the puzzle screen splits into question | work board at ≥820px. */
:root{
  --fog:#E3E9EB;      /* page ground: sea fog */
  --paper:#F7F9F9;    /* cards */
  --paper-2:#EDF2F3;
  --ink:#15303A;      /* deep harbor ink */
  --ink-2:#4E6570;
  --line:#C6D2D6;
  --sea:#276676;      /* primary */
  --sea-2:#D3E5E9;
  --on-sea:#FFFFFF;
  --lamp:#E9A532;     /* lamplight accent */
  --lamp-ink:#94600C;
  --on-lamp:#2B1C03;
  --ok:#2C8660; --ok-2:#DCEFE5;
  --bad:#BE503C; --bad-2:#F5DFD9;
  --scrim:rgba(14,30,36,.55);
  --shade:rgba(10,30,40,.14);
  /* scene palette (day fog) */
  --sky:#CFDFE4; --sky-2:#E6EEF0; --fogband:#E9F0F2;
  --sea-deep:#5F93A1; --sea-light:#8DB5BF;
  --land:#AFC2A6; --land-2:#93AE8E;
  --sand:#DCD2BF; --stone:#BFC6C4;
  --wood:#C79B6A; --wood-2:#8C6849;
  --wall:#F4F0E8; --roof-a:#C25E4B; --roof-b:#3E6C7C;
  --window:#A7C2CA; --cloth:#FFFFFF;
  --skin:#F1CDAE; --skin-2:#D9A57E; --blush:#E79A8A;
  --hair-1:#2E2A2B; --hair-2:#7A4E2E; --hair-3:#C98A3D; --hair-4:#B9B9B4;
  --match:#E8C48E; --match-head:#C8483A;
  --mail:#C8483A;
  --star-op:0;
  --f-display:"Hahmlet","Noto Serif KR","Apple SD Gothic Neo",serif;
  --f-body:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;
  --f-hand:"Gaegu","Gowun Dodum","Apple SD Gothic Neo",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --fog:#0D191E; --paper:#14242B; --paper-2:#1A2D35; --ink:#E2EBEE; --ink-2:#97ACB4; --line:#2B414A;
    --sea:#6CB2C2; --sea-2:#1B3943; --on-sea:#06171C; --lamp:#F1B547; --lamp-ink:#F1B547; --on-lamp:#2B1C03;
    --ok:#5BC293; --ok-2:#16382A; --bad:#E7816D; --bad-2:#3D211B; --scrim:rgba(0,0,0,.62); --shade:rgba(0,0,0,.3);
    --sky:#0F2733; --sky-2:#163545; --fogband:#1A3A48; --sea-deep:#16404D; --sea-light:#285B69;
    --land:#22383A; --land-2:#1B2F31; --sand:#34403F; --stone:#3A4547; --wood:#7D5F42; --wood-2:#5A4331;
    --wall:#2B3B42; --roof-a:#8F4537; --roof-b:#2A5361; --window:#F2C25B; --cloth:#DCE5E8;
    --skin:#E3BB9A; --skin-2:#C08E68; --blush:#C97A6B; --hair-4:#A3A39E; --match:#D9B47E; --match-head:#E06A58; --mail:#E06A58;
    --star-op:.85; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --fog:#0D191E; --paper:#14242B; --paper-2:#1A2D35; --ink:#E2EBEE; --ink-2:#97ACB4; --line:#2B414A;
  --sea:#6CB2C2; --sea-2:#1B3943; --on-sea:#06171C; --lamp:#F1B547; --lamp-ink:#F1B547; --on-lamp:#2B1C03;
  --ok:#5BC293; --ok-2:#16382A; --bad:#E7816D; --bad-2:#3D211B; --scrim:rgba(0,0,0,.62); --shade:rgba(0,0,0,.3);
  --sky:#0F2733; --sky-2:#163545; --fogband:#1A3A48; --sea-deep:#16404D; --sea-light:#285B69;
  --land:#22383A; --land-2:#1B2F31; --sand:#34403F; --stone:#3A4547; --wood:#7D5F42; --wood-2:#5A4331;
  --wall:#2B3B42; --roof-a:#8F4537; --roof-b:#2A5361; --window:#F2C25B; --cloth:#DCE5E8;
  --skin:#E3BB9A; --skin-2:#C08E68; --blush:#C97A6B; --hair-4:#A3A39E; --match:#D9B47E; --match-head:#E06A58; --mail:#E06A58;
  --star-op:.85; color-scheme:dark;
}

html,body{height:100%}
body{background:var(--fog);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.65;-webkit-tap-highlight-color:transparent;word-break:keep-all;overflow-wrap:break-word}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--fog)}
*{box-sizing:border-box}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--lamp);outline-offset:2px;border-radius:6px}
#app{max-width:980px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px;min-height:100%}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;line-height:1.25}
p{margin:0}
.muted{color:var(--ink-2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hand{font-family:var(--f-hand);font-size:1.18em;line-height:1.45}

/* SVG paint classes (every scene color comes from tokens) */
.f-sky{fill:var(--sky)}.f-sky2{fill:var(--sky-2)}.f-fog{fill:var(--fogband)}.f-sea{fill:var(--sea-deep)}.f-sea2{fill:var(--sea-light)}
.f-land{fill:var(--land)}.f-land2{fill:var(--land-2)}.f-sand{fill:var(--sand)}.f-stone{fill:var(--stone)}
.f-wood{fill:var(--wood)}.f-wood2{fill:var(--wood-2)}.f-wall{fill:var(--wall)}.f-roofa{fill:var(--roof-a)}.f-roofb{fill:var(--roof-b)}
.f-win{fill:var(--window)}.f-cloth{fill:var(--cloth)}.f-ink{fill:var(--ink)}.f-ink2{fill:var(--ink-2)}.f-paper{fill:var(--paper)}.f-lamp{fill:var(--lamp)}
.f-skin{fill:var(--skin)}.f-skin2{fill:var(--skin-2)}.f-blush{fill:var(--blush);opacity:.55}.f-h1{fill:var(--hair-1)}.f-h2{fill:var(--hair-2)}.f-h3{fill:var(--hair-3)}.f-h4{fill:var(--hair-4)}
.f-match{fill:var(--match)}.f-mhead{fill:var(--match-head)}.f-mail{fill:var(--mail)}.f-sea-ui{fill:var(--sea)}.f-line{fill:var(--line)}.f-shade{fill:var(--shade)}.f-none{fill:none}
.s-ink{stroke:var(--ink)}.s-ink2{stroke:var(--ink-2)}.s-line{stroke:var(--line)}.s-wood{stroke:var(--wood-2)}.s-paper{stroke:var(--paper)}.s-sea{stroke:var(--sea-light)}.s-lamp{stroke:var(--lamp)}.s-wall{stroke:var(--wall)}
.svg-t{font-family:var(--f-body);fill:var(--ink-2)}
.svg-tb{font-family:var(--f-display);font-weight:700;fill:var(--ink)}
.stars{opacity:var(--star-op)}
.glow{fill:var(--lamp);opacity:.22}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:10px 18px;border-radius:999px;border:1.5px solid transparent;font-family:var(--f-display);font-weight:700;font-size:15px;cursor:pointer;transition:transform .12s,background .15s,border-color .15s;text-decoration:none}
.btn:active{transform:translateY(1px)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn-primary{background:var(--sea);color:var(--on-sea)}
.btn-lamp{background:var(--lamp);color:var(--on-lamp)}
.btn-ghost{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-ghost:hover{border-color:var(--ink-2)}
.btn-danger{background:transparent;border-color:var(--bad);color:var(--bad)}
.btn-lg{min-height:52px;padding:12px 26px;font-size:17px}
.btn-sm{min-height:38px;padding:6px 14px;font-size:14px}
.icon-btn{width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--paper);display:inline-grid;place-items:center;cursor:pointer;font-size:22px;line-height:1;flex:none}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}

/* Top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:flex;align-items:center;gap:12px;padding-block:10px;background:var(--fog)}
.tb-title{flex:1;min-width:0;font-family:var(--f-display);font-weight:700;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb-stats{display:flex;gap:6px;flex:none}
.stat{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 11px;border-radius:999px;background:var(--paper);border:1px solid var(--line);font-size:14px;font-variant-numeric:tabular-nums;white-space:nowrap}
.stat b{font-family:var(--f-display);font-weight:700}
.stat svg{width:18px;height:18px}

/* Tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;justify-content:center;gap:6px;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--paper);border-top:1px solid var(--line)}
.tab{flex:1;max-width:200px;min-height:46px;border:0;border-radius:12px;background:transparent;font-family:var(--f-display);font-weight:700;font-size:14px;color:var(--ink-2);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--sea);background:var(--sea-2)}

/* Title */
.title-screen{display:grid;gap:18px;padding-block:20px 8px;max-width:560px;margin:0 auto}
.title-art{border-radius:20px;overflow:hidden;border:1px solid var(--line);background:var(--sky)}
.title-art svg{display:block;width:100%;height:auto}
.eyebrow{font-size:13px;letter-spacing:.14em;color:var(--lamp-ink);font-family:var(--f-display);font-weight:700}
.game-title{font-size:clamp(40px,11vw,64px);font-weight:800;letter-spacing:-.02em;line-height:1.05}
.game-title span{color:var(--sea)}
.lede{font-size:17px;color:var(--ink-2);max-width:34em}
.title-actions{display:flex;gap:10px;flex-wrap:wrap}
.save-note{font-size:13px;color:var(--ink-2)}
.title-progress{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tp{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.tp b{display:block;font-family:var(--f-display);font-size:22px;font-variant-numeric:tabular-nums}
.tp span{font-size:13px;color:var(--ink-2)}

/* Map */
.map-card{border-radius:20px;overflow:hidden;border:1px solid var(--line);background:var(--sea-deep)}
.map-card svg{display:block;width:100%;height:auto;max-height:460px}
.pin{cursor:pointer}
.pin:focus-visible{outline:none}
.pin:focus-visible .pin-dot{stroke:var(--lamp);stroke-width:4}
.pin-dot{fill:var(--paper);stroke:var(--ink);stroke-width:2.5}
.pin.done .pin-dot{fill:var(--lamp)}
.pin.locked .pin-dot{fill:var(--stone);stroke:var(--ink-2)}
.pin-label{font-family:var(--f-display);font-weight:700;font-size:12.5px;fill:var(--ink);paint-order:stroke;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round}
.pin.locked .pin-label{fill:var(--ink-2)}
.section-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-top:22px;margin-bottom:10px}
.section-h h2{font-size:19px}
.loc-list{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(260px,1fr))}
.loc{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;width:100%;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;cursor:pointer}
.loc[aria-disabled="true"]{cursor:default;background:var(--paper-2)}
.loc-n{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;background:var(--sea-2);color:var(--sea)}
.loc[aria-disabled="true"] .loc-n{background:var(--fog);color:var(--ink-2)}
.loc h3{font-size:16px}
.loc p{font-size:13.5px;color:var(--ink-2)}
.loc-meta{font-size:13px;color:var(--ink-2);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.progress-line{display:flex;gap:10px;align-items:center;margin-top:12px;font-size:14px;color:var(--ink-2)}
.bar{flex:1;height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--lamp);border-radius:99px}

/* Place */
.scene{position:relative;border-radius:20px;overflow:hidden;border:1px solid var(--line);background:var(--sky);cursor:zoom-in;touch-action:manipulation}
.scene svg{display:block;width:100%;height:auto;max-height:380px}
.scene-cap{display:flex;justify-content:space-between;gap:10px;font-size:13.5px;color:var(--ink-2);margin-top:8px;flex-wrap:wrap}
.coin-found{animation:pop .5s cubic-bezier(.2,1.6,.4,1) both;transform-box:fill-box;transform-origin:center}
.ripple{fill:none;stroke:var(--paper);stroke-width:2;animation:ripple .6s ease-out forwards;transform-box:fill-box;transform-origin:center}
@keyframes ripple{from{opacity:.9;transform:scale(.3)}to{opacity:0;transform:scale(1.6)}}
@keyframes pop{from{transform:scale(.2);opacity:0}to{transform:scale(1);opacity:1}}
.people{display:grid;gap:10px}
.person{display:grid;grid-template-columns:56px 1fr;gap:12px;align-items:center;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.person-main{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;min-width:0}
.person h3{font-size:16px}
.person .role{font-size:13px;color:var(--ink-2)}
.chip{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 10px;border-radius:99px;font-size:12.5px;font-family:var(--f-display);font-weight:700;background:var(--paper-2);color:var(--ink-2);white-space:nowrap}
.chip.new{background:var(--lamp);color:var(--on-lamp)}
.chip.try{background:var(--sea-2);color:var(--sea)}
.chip.ok{background:var(--ok-2);color:var(--ok)}
.face{display:inline-block;width:56px;height:56px;border-radius:50%;overflow:hidden;background:var(--sea-2);flex:none}
.face svg{display:block;width:100%;height:100%}
.face.sm{width:40px;height:40px}
.face.lg{width:72px;height:72px}

/* Puzzle */
.pz-head{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;align-items:center;margin-block:4px 14px}
.pz-no{grid-row:span 2;display:grid;place-items:center;width:64px;height:64px;border-radius:16px;background:var(--ink);color:var(--paper);font-family:var(--f-display);line-height:1}
.pz-no small{font-size:10px;letter-spacing:.12em;font-weight:700;opacity:.75}
.pz-no b{font-size:28px;font-weight:800;font-variant-numeric:tabular-nums}
.pz-title{font-size:clamp(20px,5vw,26px)}
.pz-tags{display:flex;gap:6px;flex-wrap:wrap}
.tag{display:inline-flex;align-items:center;gap:5px;height:28px;padding:0 10px;border-radius:99px;background:var(--paper);border:1px solid var(--line);font-size:13px;font-variant-numeric:tabular-nums}
.tag b{font-family:var(--f-display)}
.tag.value b{color:var(--lamp-ink)}
.tag svg{width:16px;height:16px}
.replay-note{background:var(--sea-2);color:var(--ink);border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:12px}
.say{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:start;margin-bottom:14px}
.bubble{position:relative;background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:10px 14px;min-width:0}
.bubble .who{display:block;font-size:12.5px;color:var(--ink-2);font-family:var(--f-display);font-weight:700}
.pz-body{position:relative;display:grid;gap:14px}
@media (min-width:820px){.pz-body{grid-template-columns:1fr 1fr;align-items:start}}
.panel{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.panel-label{font-family:var(--f-display);font-weight:700;font-size:12.5px;letter-spacing:.12em;color:var(--ink-2);margin-bottom:8px}
.q-text{font-size:17px;line-height:1.75}
.q-text p+p{margin-top:10px}
.q-art{margin-top:14px;display:flex;justify-content:center}
.q-art svg{width:100%;max-width:360px;height:auto}
.stmt{display:grid;gap:8px;margin-top:12px}
.stmt div{display:grid;grid-template-columns:auto 1fr;gap:10px;align-items:center}
.stmt q{quotes:"“" "”";font-family:var(--f-hand);font-size:19px}
.mailrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;align-items:center}
.mailbox{min-width:52px;padding:8px 10px;border-radius:10px 10px 4px 4px;background:var(--roof-b);color:#fff;font-family:var(--f-display);font-weight:800;font-size:18px;text-align:center;font-variant-numeric:tabular-nums}
.mailbox.q{background:var(--lamp);color:var(--on-lamp)}
.arrow{color:var(--ink-2)}
.clues{display:grid;gap:8px;margin-top:14px}
.clue{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
.digits{display:flex;gap:4px}
.digits span{width:30px;height:36px;border-radius:7px;display:grid;place-items:center;background:var(--ink);color:var(--paper);font-family:var(--f-display);font-weight:800;font-size:19px}
.clue p{font-size:14.5px;line-height:1.45}
.actionbar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--paper);border-top:1px solid var(--line);padding:10px max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.actionbar-in{max-width:980px;margin:0 auto;display:flex;gap:8px;align-items:center}
.actionbar-in .grow{flex:1}
.hint-dots{display:inline-flex;gap:3px;margin-left:2px}
.hint-dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.hint-dots i.on{background:var(--lamp)}

/* Answer inputs */
.ans{display:grid;gap:6px;margin-bottom:12px}
.ans-box{display:flex;align-items:baseline;justify-content:center;gap:8px;min-height:64px;padding:10px 14px;border-radius:12px;border:2px solid var(--ink);background:var(--paper-2);font-family:var(--f-display);font-weight:800;font-size:34px;font-variant-numeric:tabular-nums;letter-spacing:.06em}
.ans-box .ph{color:var(--ink-2);opacity:.5;font-weight:500}
.ans-unit{font-size:18px;color:var(--ink-2);font-weight:700;letter-spacing:0}
.keypad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.key{min-height:52px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);font-family:var(--f-display);font-weight:700;font-size:22px;cursor:pointer}
.key:active{background:var(--sea-2)}
.key-sub{font-size:15px;color:var(--ink-2)}
.choices{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.choice{display:flex;flex-direction:column;align-items:center;gap:6px;padding:14px 10px;border-radius:14px;border:2px solid var(--line);background:var(--paper);cursor:pointer;font-family:var(--f-display);font-weight:700;font-size:17px}
.choice[aria-pressed="true"]{border-color:var(--sea);background:var(--sea-2)}
.work-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:12px;flex-wrap:wrap;font-size:14px}
.work-foot b{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.work-status{font-size:14px;color:var(--ink-2);margin-top:10px;min-height:1.6em}

/* Lights */
.lights{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:0 auto;padding:14px;border-radius:16px;background:var(--sky)}
.lamp-btn{aspect-ratio:1;border-radius:14px;border:0;background:var(--sea-deep);cursor:pointer;padding:6px;display:grid;place-items:center}
.lamp-btn svg{width:100%;height:100%}
.lamp-btn.on{background:var(--sea-light)}

/* Matches */
.match-svg{width:100%;max-width:420px;display:block;margin:0 auto;touch-action:manipulation}
.match-svg .slot{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:4 4;opacity:0}
.match-svg.holding .slot{opacity:1}
.match-svg .slot.from{stroke:var(--lamp);opacity:1}
.match-svg .hit{fill:transparent;cursor:pointer}
.match-svg .moved .f-match{fill:var(--lamp)}

/* River & bridge */
.crossing{display:grid;border-radius:16px;overflow:hidden;border:1px solid var(--line)}
.bank{background:var(--land);padding:10px 12px;min-height:96px;display:grid;gap:6px}

.ferry{position:absolute;left:50%;top:8px;transform:translateX(-50%);transition:top .7s ease-in-out;display:flex;align-items:flex-end;gap:2px;padding:4px 12px 6px;border-radius:6px 6px 26px 26px;background:var(--wood);border-bottom:6px solid var(--wood-2);min-width:130px;justify-content:center}

.log{font-size:13.5px;color:var(--ink-2);margin-top:8px;display:flex;flex-wrap:wrap;gap:4px 10px}

/* Sliding */
.slide-wrap{position:relative;width:min(100%,360px);margin:0 auto;padding-right:26px}
.slide-board{position:relative;aspect-ratio:1;max-width:100%;border-radius:12px;background:var(--sea-deep);border:3px solid var(--wood-2);touch-action:none;background-image:linear-gradient(var(--sea-light) 1px,transparent 1px),linear-gradient(90deg,var(--sea-light) 1px,transparent 1px);background-size:calc(100%/6) calc(100%/6)}
.exit{position:absolute;right:0;top:calc(3px + (100% - 6px) / 3);height:calc((100% - 6px) / 6);width:30px;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:11px;color:var(--on-lamp);background:var(--lamp);border-radius:0 8px 8px 0;writing-mode:vertical-rl}
.blk{position:absolute;padding:4px;touch-action:none;cursor:grab;transition:left .12s,top .12s}
.blk.drag{transition:none;cursor:grabbing;z-index:3}
.blk i{display:block;width:100%;height:100%;border-radius:10px;background:var(--wood);border:2px solid var(--wood-2);box-shadow:inset 0 0 0 3px rgba(255,255,255,.12)}
.blk.v i{border-radius:14px 14px 8px 8px}
.blk.h i{border-radius:8px 16px 16px 8px}
.blk.c1 i{background:var(--roof-b)}.blk.c2 i{background:var(--sea-light)}.blk.c3 i{background:var(--stone)}
.blk.target i{background:var(--mail);border-color:var(--ink);display:grid;place-items:center;color:#fff;font-family:var(--f-display);font-weight:800;font-size:13px}
.blk:focus-visible{outline:none}.blk:focus-visible i{outline:3px solid var(--lamp)}
.blk.out{left:110%!important;transition:left .6s ease-in}

/* Overlays */
.ov{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:fade .18s ease-out}

.sheet{width:100%;max-width:560px;max-height:calc(100% - 20px);overflow:auto;background:var(--paper);border-radius:20px;padding:20px;box-shadow:0 20px 50px var(--shade);animation:rise .22s ease-out}

.hint{border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:10px}

.earn{font-family:var(--f-display);font-weight:800;font-size:26px;color:var(--lamp-ink)}

/* Notebook */
.nb-summary{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:4px}

<script>
"use strict";
/* =========================================================
   ART HELPERS — every color is a token class (see CSS)
   ========================================================= */
const svg = (vb, inner, label) =>
  `<svg viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" ${label ? `role="img" aria-label="${label}"` : 'aria-hidden="true"'}>${inner}</svg>`;

const ICON = {
  coin: `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10" class="f-lamp"/><circle cx="12" cy="12" r="6.5" class="f-none s-ink" stroke-width="1.6" opacity=".45"/><path d="M12 7.5v9M9.5 10h5" class="f-none s-ink" stroke-width="1.8" stroke-linecap="round" opacity=".6"/></svg>`,
  star: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.8l2.7 5.7 6.2.8-4.6 4.3 1.2 6.2L12 16.8l-5.5 3 1.2-6.2L3.1 9.3l6.2-.8z" class="f-sea-ui"/></svg>`,
  map: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6l6-2 6 2 6-2v14l-6 2-6-2-6 2z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M9 4v14M15 6v14" fill="none" stroke="currentColor" stroke-width="1.8"/></svg>`,
  book: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4.5h6a2 2 0 012 2V20a2 2 0 00-2-2H4zM20 4.5h-6a2 2 0 00-2 2V20a2 2 0 012-2h6z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>`,
  home: `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>`,
  check: `<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" style="fill:var(--ok)"/><path d="M7 12.5l3.2 3.2L17 9" fill="none" style="stroke:var(--ok-2)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  lock: `<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="5" y="10.5" width="14" height="10" rx="2" class="f-ink2"/><path d="M8 10.5V8a4 4 0 018 0v2.5" fill="none" class="s-ink2" stroke-width="2"/></svg>`,
};

/* ---------- villager faces ---------- */
function face(o = {}) {
  const hair = o.hair || "f-h1", skin = o.skin || "f-skin", shirt = o.shirt || "f-roofb";
  let back = "", front = "", acc = "";
  const shortHair = `<path class="${hair}" d="M16 32C16 19 24 14 32 14c10 0 16 6 16 18-3-7-8-10-16-10s-13 3-16 10z"/>`;
  switch (o.style) {
    case "short": front = shortHair; break;
    case "kid": front = `<path class="${hair}" d="M16 32l2-12 5 3 3-8 5 6 4-7 4 7 5-4 2 7 2 8c-4-6-10-8-16-8s-12 2-16 8z"/>`; break;
    case "long":
      back = `<path class="${hair}" d="M14 36c0-16 8-22 18-22s18 6 18 22v18h-7V34c-3-6-7-9-11-9s-8 3-11 9v20h-7z"/>`;
      front = `<path class="${hair}" d="M17 31c1-10 7-15 15-15 9 0 14 5 15 15-5-5-9-7-15-7s-11 2-15 7z"/>`; break;
    case "bun": front = shortHair + `<circle class="${hair}" cx="32" cy="12" r="6.5"/>`; break;
    case "bald": front = `<ellipse class="${hair}" cx="17.5" cy="31" rx="3" ry="5"/><ellipse class="${hair}" cx="46.5" cy="31" rx="3" ry="5"/>`; break;
    case "cap": front = shortHair + `<path class="f-roofb" d="M15 28c0-11 8-16 17-16s17 5 17 16z"/><rect class="f-ink" x="12" y="27" width="40" height="4" rx="2"/>`; break;
    case "post": front = shortHair + `<path class="f-roofb" d="M17 27l1-12h28l1 12z"/><path class="f-ink" d="M21 26.5q11 6 22 0v3q-11 6-22 0z"/><circle class="f-lamp" cx="32" cy="20.5" r="3"/>`; break;
    case "chef": front = `<path class="f-cloth" d="M18 27c-6-2-5-14 3-13 1-7 11-8 13-2 4-6 16-3 12 5 6 2 4 11 0 10v3H18z"/><rect class="f-line" x="18" y="26" width="28" height="3"/>`; break;
    case "beret": front = shortHair + `<path class="f-roofa" d="M14 26c0-10 12-13 22-12 10 1 15 7 12 12-8-4-24-4-34 0z"/><rect class="f-roofa" x="35" y="9" width="2.5" height="5" rx="1"/>`; break;
    case "scarf": front = `<path class="f-roofa" d="M14 34c0-16 9-21 18-21s18 5 18 21c-4-7-10-10-18-10s-14 3-18 10z"/><circle class="f-roofa" cx="47" cy="40" r="4"/>`; break;
    case "band": front = shortHair + `<rect class="f-cloth" x="15.5" y="24" width="33" height="4.5" rx="2"/>`; break;
    default: front = shortHair;
  }
  if (o.glasses) acc += `<g class="f-none s-ink" stroke-width="1.6"><circle cx="26" cy="35" r="4.4"/><circle cx="38" cy="35" r="4.4"/><path d="M30.4 35h3.2"/></g>`;
  if (o.beard) acc += `<path class="${hair}" d="M18 38c0 14 8 16 14 16s14-2 14-16c-4 8-9 9-14 9s-10-1-14-9z"/>`;
  if (o.mustache) acc += `<path class="${hair}" d="M25 42.5q4-3.5 7-1.5 3-2 7 1.5-4 2.5-7 1.2-3 1.3-7-1.2z"/>`;
  const mouth = o.beard || o.mustache ? "" : `<path d="M27.5 41.5q4.5 4 9 0" class="f-none s-ink" stroke-width="1.7" stroke-linecap="round"/>`;
  return `<span class="face ${o.size || ""}">${svg("0 0 64 64",
    `${back}<path class="${shirt}" d="M8 66c2-12 12-16 24-16s22 4 24 16z"/>
     <circle class="${skin}" cx="16.5" cy="36" r="3.4"/><circle class="${skin}" cx="47.5" cy="36" r="3.4"/>
     <circle class="${skin}" cx="32" cy="34" r="16"/>
     <circle class="f-blush" cx="23" cy="40.5" r="2.6"/><circle class="f-blush" cx="41" cy="40.5" r="2.6"/>
     ${front}<circle class="f-ink" cx="26" cy="35" r="1.9"/><circle class="f-ink" cx="38" cy="35" r="1.9"/>${mouth}${acc}`)}</span>`;
}

const PEOPLE = {
  deokbae: { name: "덕배 할아버지", role: "뱃사공", f: { style: "cap", hair: "f-h4", beard: true, shirt: "f-wood2" } },
  bomi: { name: "봄이", role: "항구 잡화점 주인", f: { style: "bun", hair: "f-h2", shirt: "f-roofa" } },
  hangyeol: { name: "한결", role: "가로등지기", f: { style: "short", hair: "f-h1", glasses: true, shirt: "f-sea2" } },
  bori: { name: "보리 할머니", role: "빵집 주인", f: { style: "chef", hair: "f-h4", glasses: true, shirt: "f-wood" } },
  rui: { name: "루이", role: "간판장이", f: { style: "beret", hair: "f-h3", shirt: "f-roofb" } },
  daon: { name: "다온", role: "빵집 막내", f: { style: "kid", hair: "f-h2", shirt: "f-lamp" } },
  os: { name: "오스", role: "시계공", f: { style: "bald", hair: "f-h4", glasses: true, mustache: true, shirt: "f-ink2" } },
  naru: { name: "나루", role: "우체부", f: { style: "post", hair: "f-h1", shirt: "f-roofb" } },
  haeden: { name: "해든", role: "꽃집 주인", f: { style: "long", hair: "f-h3", shirt: "f-land2" } },
  galmae: { name: "갈매 아주머니", role: "어시장 상인", f: { style: "scarf", hair: "f-h1", shirt: "f-sea2" } },
  taki: { name: "타키", role: "생선가게 주인", f: { style: "band", hair: "f-h1", shirt: "f-roofa" } },
  dodam: { name: "도담", role: "항만 관리인", f: { style: "cap", hair: "f-h2", shirt: "f-wood2" } },
  haesun: { name: "해순 할머니", role: "등대지기", f: { style: "bun", hair: "f-h4", glasses: true, shirt: "f-roofb" } },
  parang: { name: "파랑", role: "등대지기의 손자", f: { style: "kid", hair: "f-h1", shirt: "f-sea2" } },
};
const faceOf = (k, size) => face({ ...PEOPLE[k].f, size });

/* ---------- small scene parts ---------- */
const waves = (y, x0 = 0, x1 = 360, step = 34) => {
  let d = "";
  for (let x = x0; x < x1; x += step) d += `M${x} ${y}q${step / 4} -5 ${step / 2} 0`;
  return `<path d="${d}" class="f-none s-sea" stroke-width="2" stroke-linecap="round" opacity=".8"/>`;
};
const gull = (x, y) => `<path d="M${x - 7} ${y}q3.5-5 7 0q3.5-5 7 0" class="f-none s-ink" stroke-width="1.5" stroke-linecap="round" opacity=".7"/>`;
const boatAt = (x, y, s = 1, hull = "f-roofa") =>
  `<g transform="translate(${x} ${y}) scale(${s})"><path d="M-30 0h60l-8 12h-44z" class="${hull}"/><rect x="-1.5" y="-34" width="3" height="34" class="f-wood2"/><path d="M1.5-32L22-6H1.5z" class="f-cloth"/></g>`;
const win = (x, y, w = 10, h = 12) => `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="1.5" class="f-win"/>`;
const tree = (x, y, s = 1) =>
  `<g transform="translate(${x} ${y}) scale(${s})"><rect x="-3" y="0" width="6" height="26" class="f-wood2"/><circle cx="0" cy="-8" r="16" class="f-land2"/><circle cx="-10" cy="2" r="11" class="f-land2"/><circle cx="10" cy="2" r="11" class="f-land2"/></g>`;
const glint = (x, y) => `<path d="M${x - 6} ${y}h12M${x} ${y - 4}v8" class="f-none s-paper" stroke-width="1.4" stroke-linecap="round" opacity=".55"/>`;

/* =========================================================
   LOCATIONS
   ========================================================= */
const LOCS = [
  {
    id: "dock", name: "선착장", need: 0, pin: [78, 206],
    desc: "마을의 입구. 고깃배와 갈매기가 먼저 반겨 줍니다.",
    coins: [{ id: "dock-1", x: 195, y: 98 }, { id: "dock-2", x: 110, y: 134 }, { id: "dock-3", x: 332, y: 79 }, { id: "dock-4", x: 226, y: 168 }],
    scene: () => `
      <rect width="360" height="200" class="f-sky"/>
      <circle cx="292" cy="40" r="15" class="f-lamp" opacity=".55"/>
      <path d="M0 96Q50 72 110 90T230 84T360 82V110H0z" class="f-fog"/>
      <rect y="100" width="360" height="100" class="f-sea"/>
      ${waves(118)}${waves(146, 10)}${waves(178)}
      ${gull(60, 44)}${gull(84, 56)}${gull(232, 34)}

/* =========================================================
   STATE — progress lives in this browser and, when the
   viewer is signed in, in their private db document.
   ========================================================= */
const START_COINS = 5;
const KEY = "angae-puzzle-v1";
const VALUE_STEPS = [1, .8, .6, .4];
const byId = Object.fromEntries(PUZ.map(p => [p.id, p]));
const locById = Object.fromEntries(LOCS.map(l => [l.id, l]));
const MAX_SCORE = PUZ.reduce((a, p) => a + p.value, 0);
const pad = n => String(n).padStart(2, "0");
const EMPTY_P = Object.freeze({ seen: false, solved: false, wrong: 0, hints: 0, earned: 0 });

function blank() { return { v: 1, started: false, introSeen: false, endingSeen: false, coins: [], p: {}, updatedAt: 0 }; }
function sanitize(o) {
  const s = blank();
  if (!o || typeof o !== "object") return s;
  s.started = !!o.started; s.introSeen = !!o.introSeen; s.endingSeen = !!o.endingSeen;
  if (Array.isArray(o.coins)) s.coins = [...new Set(o.coins.filter(c => COIN_IDS.has(c)))];
  if (o.p && typeof o.p === "object") {
    for (const k of Object.keys(o.p)) {
      if (!byId[k]) continue;
      const x = o.p[k] || {};
      s.p[k] = { seen: !!x.seen, solved: !!x.solved, wrong: Math.max(0, x.wrong | 0), hints: Math.min(3, Math.max(0, x.hints | 0)), earned: Math.max(0, x.earned | 0) };
    }
  }
  s.updatedAt = +o.updatedAt || 0;
  return s;
}
function merge(a, b) {
  const m = blank();
  m.started = a.started || b.started; m.introSeen = a.introSeen || b.introSeen; m.endingSeen = a.endingSeen || b.endingSeen;
  m.coins = [...new Set([...a.coins, ...b.coins])];
  for (const id of new Set([...Object.keys(a.p), ...Object.keys(b.p)])) {
    const x = a.p[id] || EMPTY_P, y = b.p[id] || EMPTY_P;
    const solved = x.solved || y.solved;
    let earned = 0, wrong;
    if (solved) {
      const pick = x.solved && y.solved ? (x.earned >= y.earned ? x : y) : (x.solved ? x : y);
      earned = pick.earned; wrong = pick.wrong;
    } else wrong = Math.max(x.wrong, y.wrong);
    m.p[id] = { seen: x.seen || y.seen || solved, solved, wrong, hints: Math.max(x.hints, y.hints), earned };
  }
  m.updatedAt = Math.max(a.updatedAt, b.updatedAt);
  return m;
}
const canon = o => JSON.stringify(o, (k, v) => v && typeof v === "object" && !Array.isArray(v) ? Object.fromEntries(Object.keys(v).sort().map(x => [x, v[x]])) : v);

function loadLocal() { try { const t = localStorage.getItem(KEY); if (t) return sanitize(JSON.parse(t)); } catch (e) { } return blank(); }
function saveLocal() { try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) { } }
let S = loadLocal();
function save() { S.updatedAt = Date.now(); saveLocal(); queueCloud(); }

const ps = id => S.p[id] || (S.p[id] = { ...EMPTY_P });
const peek = id => S.p[id] || EMPTY_P;
const solvedN = () => PUZ.filter(p => peek(p.id).solved).length;
const scoreN = () => PUZ.reduce((a, p) => a + (peek(p.id).solved ? peek(p.id).earned : 0), 0);
const spentN = () => PUZ.reduce((a, p) => a + peek(p.id).hints, 0);
const coinsN = () => Math.max(0, START_COINS + S.coins.length - spentN());
const valueOf = (p, wrong) => Math.round(p.value * VALUE_STEPS[Math.min(wrong, 3)]);
const isOpen = l => solvedN() >= l.need;
function rankOf() {
  const r = scoreN() / MAX_SCORE;
  return r >= .9 ? "안개곶 명탐정" : r >= .7 ? "등대지기의 단골" : r >= .5 ? "골목 퍼즐꾼" : "새내기 여행자";
}

/* ---------- cloud sync (db capability) ---------- */
const cloud = { ref: null, status: "local", writing: false, pending: false, timer: null };
function saveNote() {
  return cloud.status === "cloud" ? "진행 기록은 claude.ai 계정에 저장되어, 다른 기기에서 열어도 이어집니다." : "진행 기록은 이 브라우저에 저장됩니다.";
}
function refreshSaveNote() { document.querySelectorAll("[data-save-note]").forEach(e => e.textContent = saveNote()); }
const withTimeout = (pr, ms) => Promise.race([pr, new Promise((_, rej) => setTimeout(() => rej({ code: "timeout" }), ms))]);
async function initCloud() {
  try {
    if (!window.claude || typeof window.claude.use !== "function") return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id();
    if (!uid) return;
    const ref = db.doc("data/users/" + uid + "/progress");
    const snap = await withTimeout(ref.get(), 10000);
    const remote = snap.exists ? sanitize((snap.data() || {}).state) : null;
    cloud.ref = ref; cloud.status = "cloud";
    if (remote) {
      const merged = merge(S, remote);
      const changedLocal = canon(merged) !== canon(S);
      const changedRemote = canon(merged) !== canon(remote);
      S = merged; saveLocal();
      if (changedLocal) softRefresh();
      if (changedRemote) queueCloud();
    } else if (S.started) queueCloud();
    refreshSaveNote();
  } catch (e) { cloud.ref = null; cloud.status = "local"; refreshSaveNote(); }
}
function queueCloud() { if (!cloud.ref) return; clearTimeout(cloud.timer); cloud.timer = setTimeout(flushCloud, 900); }
async function flushCloud() {
  if (!cloud.ref) return;
  if (cloud.writing) { cloud.pending = true; return; }
  cloud.writing = true;
  try { await cloud.ref.set({ state: JSON.parse(JSON.stringify(S)), updatedAt: Date.now() }); }
  catch (e) {
    const code = e && e.code;
    if (code === "unavailable") setTimeout(flushCloud, 1500 + Math.random() * 1500);
    else { cloud.ref = null; cloud.status = "local"; refreshSaveNote(); }
  } finally {
    cloud.writing = false;
    if (cloud.pending) { cloud.pending = false; queueCloud(); }
  }
}
function softRefresh() {
  if (["title", "map", "place", "notebook"].includes(ui.screen) && !sheetEl) render();
  else refreshStats();
}

const ui = { screen: "title", loc: null, pz: null, replay: false, from: "place", filter: "all" };

function go(screen, opts = {}) {

  PZ = null;
  Object.assign(ui, opts, { screen });
  render();
  window.scrollTo(0, 0);
}
function render() {
  ({ title: renderTitle, map: renderMap, place: renderPlace, puzzle: renderPuzzle, notebook: renderNotebook, answer: renderAnswer, ending: renderEnding }[ui.screen] || renderTitle)();
}
function topbar(title, backAct) {
  return `<header class="topbar"><button class="icon-btn" data-act="${backAct}" aria-label="뒤로">‹</button><div class="tb-title">${title}</div>
    <div class="tb-stats"><span class="stat" title="힌트 코인">${ICON.coin}<b data-coins>${coinsN()}</b></span><span class="stat" title="점수">${ICON.star}<b data-score>${scoreN()}</b></span></div></header>`;
}
function refreshStats() {
  document.querySelectorAll("[data-coins]").forEach(e => e.textContent = coinsN());
  document.querySelectorAll("[data-score]").forEach(e => e.textContent = scoreN());
}
function tabbar(on) {

    <button class="tab ${on === "map" ? "on" : ""}" data-act="go-map" ${on === "map" ? 'aria-current="page"' : ""}>${ICON.map}마을 지도</button>
    <button class="tab ${on === "nb" ? "on" : ""}" data-act="go-notebook" ${on === "nb" ? 'aria-current="page"' : ""}>${ICON.book}퍼즐 수첩</button>
    <button class="tab" data-act="go-title">${ICON.home}처음 화면</button></nav>`;
}
let toastT = null;
function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");

function mountNumber(work, p) {
  work.innerHTML = `<div class="ans"><div class="ans-box" aria-live="polite"><span data-val></span><span class="ans-unit">${p.unit || ""}</span></div></div>

/* ---------- judging ---------- */
function stamp(ok) {

  return `<svg class="stamp" viewBox="0 0 150 150" aria-hidden="true">${rays}<g class="stamp-g"><circle cx="75" cy="75" r="57" class="f-paper"/><circle cx="75" cy="75" r="54" class="stamp-ring"/><circle cx="75" cy="75" r="45" class="stamp-ring" stroke-width="2"/><text x="75" y="91" text-anchor="middle" class="stamp-t">${ok ? "정답" : "오답"}</text></g></svg><h2 class="sr">${ok ? "정답입니다" : "오답입니다"}</h2>`;
}

  if (!PZ.replay && !st.solved) { first = true; earned = valueOf(p, st.wrong); st.solved = true; st.earned = earned; save(); }
  const newly = first ? LOCS.filter(l => isOpen(l) && !before.has(l.id)) : [];
  refreshStats();
  openSheet(`<div class="judge ok">${stamp(true)}
    ${first ? `<div class="earn">+${earned}점</div>` : `<p class="muted">다시 풀기 성공! 기록은 그대로입니다.</p>`}
    ${say(p.who, p.bye)}
    <div class="explain"><h3>정답 · ${p.answerText}</h3>${p.explain}</div>
    ${newly.map(l => `<div class="unlock-note">새 장소가 열렸습니다: ${l.name}</div>`).join("")}
    <div class="sheet-actions"><button class="btn btn-lamp btn-lg" data-act="after-solve" data-first="${first ? 1 : 0}">계속</button></div></div>`, { dismiss: false });
}

    line = a < b ? `이 퍼즐의 가치가 ${b}점에서 ${a}점으로 내려갔습니다.` : `가치는 ${a}점 아래로는 내려가지 않습니다.`;
    const v = app.querySelector("[data-value]"); if (v) v.textContent = a;
  }
  openSheet(`<div class="judge bad">${stamp(false)}<p>${msg || "정답이 아닙니다."}</p>${line ? `<p class="muted" style="margin-top:6px">${line}</p>` : ""}
    <div class="sheet-actions"><button class="btn btn-primary btn-lg" data-act="close-sheet">다시 도전</button><button class="btn btn-ghost btn-lg" data-act="pz-back">그만두기</button></div></div>`, { dismiss: true });
}

/* ---------- memo ---------- */
const memoStore = {};
let memo = null;
function cssVar(n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim() || "#000"; }

  const cv = document.createElement("canvas"); cv.className = "memo-canvas"; cv.setAttribute("aria-label", "메모 칸. 손가락이나 마우스로 그릴 수 있습니다");
  host.appendChild(cv);
  const dpr = window.devicePixelRatio || 1, w = host.clientWidth, h = host.clientHeight;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr); cv.style.width = w + "px"; cv.style.height = h + "px";
  const ctx = cv.getContext("2d"); ctx.scale(dpr, dpr); ctx.lineCap = "round"; ctx.lineJoin = "round";
  memo = { cv, ctx, tool: "pen", color: "ink", strokes: memoStore[PZ.p.id] || (memoStore[PZ.p.id] = []), cur: null };
  const stroke = s => {
    ctx.globalCompositeOperation = s.tool === "eraser" ? "destination-out" : "source-over";
    ctx.strokeStyle = s.tool === "eraser" ? "#000" : cssVar(s.color === "bad" ? "--bad" : "--ink");
    ctx.lineWidth = s.tool === "eraser" ? 22 : 3.2;

const SEG = { 0: "abcdef", 1: "bc", 2: "abdeg", 3: "abcdg", 4: "bcfg", 5: "acdfg", 6: "acdefg", 7: "abc", 8: "abcdefg", 9: "abcdfg" };
const SEG_INV = Object.fromEntries(Object.entries(SEG).map(([k, v]) => [v, +k]));
function mountMatches(el, api) {
  const OX = { 0: 10, 2: 150, 4: 290 };
  const segRect = (ox, s) => {
    const oy = 8, L = 46, T = 9;
    return { a: { x: ox + 7, y: oy, w: L, h: T, hz: 1 }, g: { x: ox + 7, y: oy + 51, w: L, h: T, hz: 1 }, d: { x: ox + 7, y: oy + 102, w: L, h: T, hz: 1 },
      f: { x: ox, y: oy + 6, w: T, h: L, hz: 0 }, b: { x: ox + 51, y: oy + 6, w: T, h: L, hz: 0 }, e: { x: ox, y: oy + 57, w: T, h: L, hz: 0 }, c: { x: ox + 51, y: oy + 57, w: T, h: L, hz: 0 } }[s];
  };
  const rectOf = k => { const pos = +k[0], s = k.slice(1); if (pos === 1) return s === "h" ? { x: 92, y: 59, w: 40, h: 9, hz: 1 } : { x: 107.5, y: 43.5, w: 9, h: 40, hz: 0 }; return segRect(OX[pos], s); };
  const SLOTS = [...[0, 2, 4].flatMap(p => [..."abcdefg"].map(s => p + s)), "1h", "1v"];
  const ORIG = new Set(["1h", "1v", ...[...SEG[9]].map(s => "0" + s), ...[...SEG[6]].map(s => "2" + s), ...[...SEG[1]].map(s => "4" + s)]);
  let cur = new Set(ORIG), held = null, done = false;
  const stick = (r, cls = "") => `<g class="${cls}"><rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="3" class="f-match"/>${r.hz ? `<circle cx="${r.x + r.w - 4}" cy="${r.y + r.h / 2}" r="${r.h / 2 + 1.2}" class="f-mhead"/>` : `<circle cx="${r.x + r.w / 2}" cy="${r.y + 4}" r="${r.w / 2 + 1.2}" class="f-mhead"/>`}</g>`;
  el.innerHTML = `<svg class="match-svg" viewBox="0 0 360 128" role="img" aria-label="성냥개비로 만든 식"></svg>
    <p class="work-status" data-status></p>
    <div class="work-foot"><span class="muted">성냥개비 1개만 옮길 수 있습니다.</span><button class="btn btn-ghost btn-sm" data-r>처음부터</button></div>`;
  const svgEl = el.querySelector("svg"), status = el.querySelector("[data-status]");
  const added = () => [...cur].filter(k => !ORIG.has(k));
  function decode() {
    const d = [0, 2, 4].map(p => SEG_INV[[..."abcdefg"].filter(s => cur.has(p + s)).join("")]);
    const op = cur.has("1h") && cur.has("1v") ? "+" : cur.has("1h") && !cur.has("1v") ? "-" : null;
    if (d.some(x => x === undefined) || !op) return null;
    return { text: `${d[0]} ${op === "+" ? "+" : "−"} ${d[1]} = ${d[2]}`, ok: (op === "+" ? d[0] + d[1] : d[0] - d[1]) === d[2] };
  }
  function draw() {
    const mv = added()[0];
    let s = stick({ x: 226, y: 46, w: 40, h: 9, hz: 1 }) + stick({ x: 226, y: 72, w: 40, h: 9, hz: 1 });
    for (const k of SLOTS) { const r = rectOf(k); s += cur.has(k) ? stick(r, k === mv ? "moved" : "") : `<rect class="slot ${k === held ? "from" : ""}" x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="3"/>`; }
    for (const k of SLOTS) { const r = rectOf(k); s += `<rect class="hit" data-k="${k}" x="${r.x - 5}" y="${r.y - 5}" width="${r.w + 10}" height="${r.h + 10}"/>`; }
    svgEl.innerHTML = s; svgEl.classList.toggle("holding", !!held);
    const r = decode();
    status.textContent = held ? "성냥개비를 집었습니다. 점선으로 보이는 빈 자리를 눌러 내려놓으세요." : mv ? `지금 식: ${r ? r.text : "읽을 수 없는 모양"} · 맞다고 생각하면 「답 확인」을 누르세요.` : "옮길 성냥개비를 누르세요.";
  }
  svgEl.addEventListener("click", e => {
    const t = e.target.closest("[data-k]"); if (!t || done) return;
    const k = t.dataset.k;
    if (held) { if (cur.has(k)) { api.toast("성냥개비가 없는 빈 자리를 눌러 내려놓으세요."); return; } cur.add(k); held = null; draw(); return; }
    if (!cur.has(k)) return;
    const mv = added();
    if (mv.length && k !== mv[0]) { api.toast("성냥개비는 1개만 옮길 수 있어요. 다시 하려면 「처음부터」를 누르세요."); return; }
    cur.delete(k); held = k; draw();
  });
  el.querySelector("[data-r]").addEventListener("click", () => { if (done) return; cur = new Set(ORIG); held = null; draw(); });
  api.setSubmit(() => {
    if (held) { api.toast("들고 있는 성냥개비를 먼저 내려놓으세요."); return; }
    if (!added().length) { api.toast("성냥개비를 1개 옮긴 뒤에 「답 확인」을 누르세요."); return; }
    const r = decode();
    if (!r) { api.toast("숫자나 기호로 읽을 수 없는 모양이 있어요. 다시 옮겨 보세요."); return; }
    if (r.ok) { done = true; api.solve(); } else api.fail(`「${r.text}」은(는) 맞는 식이 아닙니다.`);
  });
  draw();
}

function mountRiver(el, api) {
  const NAME = { dog: "강아지", cat: "고양이", fish: "생선" }, OBJ = { dog: "강아지를", cat: "고양이를", fish: "생선을" };
  let pos, boat, pass, n, busy = false, done = false;
  const reset = () => { pos = { dog: 0, cat: 0, fish: 0 }; boat = 0; pass = null; n = 0; };
  reset();
  el.innerHTML = `<div class="crossing"><div class="bank"><div class="bank-label">이쪽 기슭</div><div class="bank-items" data-side="0"></div></div>
    <div class="stream"><div class="ferry" data-ferry></div></div>
    <div class="bank"><div class="bank-label">건너편 · 할머니 댁</div><div class="bank-items" data-side="1"></div></div></div>
    <p class="work-status" data-status></p>

  const tok = k => `<button class="token" data-k="${k}">${PET[k]}<span>${NAME[k]}</span></button>`;
  const ferry = el.querySelector("[data-ferry]");
  function draw() {
    for (const side of [0, 1]) el.querySelector(`[data-side="${side}"]`).innerHTML = Object.keys(pos).filter(k => pos[k] === side && k !== pass).map(tok).join("") || `<span class="muted" style="font-size:13px">비어 있음</span>`;
    ferry.classList.toggle("far", boat === 1);
    ferry.innerHTML = faceOf("haeden") + (pass ? tok(pass) : "");
    el.querySelector("[data-n]").textContent = n;
    el.querySelector("[data-status]").textContent = pass ? `${OBJ[pass]} 태웠습니다. 「배 띄우기」를 누르세요. 다시 누르면 내립니다.` : `배는 ${boat ? "건너편" : "이쪽 기슭"}에 있습니다. 같은 쪽에 있는 것을 눌러 태우세요.`;
  }
  el.addEventListener("click", e => {
    if (done || busy) return;
    const t = e.target.closest(".token");
    if (t) {
      const k = t.dataset.k;
      if (k === pass) { pass = null; draw(); return; }
      if (pos[k] !== boat) { api.toast("배가 반대편에 있어요."); return; }
      pass = k; draw(); return;
    }
    if (e.target.closest("[data-r]")) { reset(); draw(); return; }
    if (e.target.closest("[data-go]")) {
      busy = true; const from = boat; boat = 1 - boat; ferry.classList.toggle("far", boat === 1);
      setTimeout(() => {
        busy = false;
        if (pass) { pos[pass] = boat; pass = null; }
        n++;
        const left = Object.keys(pos).filter(k => pos[k] === from);
        const bad = left.includes("dog") && left.includes("cat") ? "해든이 없는 사이 강아지가 고양이를 괴롭혔어요." : left.includes("cat") && left.includes("fish") ? "해든이 없는 사이 고양이가 생선을 먹어 버렸어요." : null;
        draw();
        if (bad) { api.fail(bad); reset(); draw(); return; }
        if (Object.values(pos).every(v => v === 1)) { done = true; setTimeout(api.solve, 450); }
      }, 740);
    }
  });
  draw();
}

    <div class="oil"><div class="row" style="justify-content:space-between;font-size:14px"><span>등불이 켜져 있을 남은 시간</span><b data-left></b></div><div class="bar"><i data-oil></i></div></div>
    <div class="log" data-log></div>
    <div class="work-foot"><span class="muted" data-status></span><div class="row"><button class="btn btn-ghost btn-sm" data-r>처음부터</button><button class="btn btn-primary btn-sm" data-go>건너기</button></div></div>`;
  const tok = k => `<button class="token ${sel.has(k) ? "sel" : ""}" data-k="${k}" aria-pressed="${sel.has(k)}">${faceOf(k)}<span>${NM[k]} ${T[k]}분</span></button>`;
  function draw() {
    for (const s of [0, 1]) el.querySelector(`[data-side="${s}"]`).innerHTML = Object.keys(side).filter(k => side[k] === s).map(tok).join("") || `<span class="muted" style="font-size:13px">아무도 없음</span>`;
    el.querySelector("[data-lamp]").innerHTML = `<span class="ico">${lampSvg(true)}</span>등불: ${lamp ? "등대 쪽" : "출발 쪽"}`;
    const left = Math.max(0, LIMIT - time);
    el.querySelector("[data-left]").textContent = `${left}분`;
    el.querySelector("[data-oil]").style.width = (left / LIMIT * 100) + "%";
    el.querySelector("[data-log]").innerHTML = log.map((t, i) => `<span>${i + 1}. ${t}</span>`).join("");
    el.querySelector("[data-status]").textContent = `걸린 시간 ${time}분 · ${sel.size ? [...sel].map(k => NM[k]).join("·") + " 선택" : "등불 쪽에서 1~2명을 고르세요"}`;
  }
  el.addEventListener("click", e => {
    if (done) return;
    const t = e.target.closest(".token");
    if (t) {
      const k = t.dataset.k;
      if (side[k] !== lamp) { api.toast("등불이 있는 쪽 사람만 건널 수 있어요."); return; }
      if (sel.has(k)) sel.delete(k); else { if (sel.size >= 2) { api.toast("다리는 한 번에 2명까지만 건널 수 있어요."); return; } sel.add(k); }
      draw(); return;
    }
    if (e.target.closest("[data-r]")) { reset(); draw(); return; }
    if (e.target.closest("[data-go]")) {
      if (!sel.size) { api.toast("건널 사람을 1~2명 고르세요."); return; }
      const ks = [...sel], dt = Math.max(...ks.map(k => T[k]));
      time += dt; ks.forEach(k => side[k] = 1 - lamp); lamp = 1 - lamp; sel.clear();
      log.push(`${ks.map(k => NM[k]).join("·")} ${lamp ? "건넘" : "돌아옴"} ${dt}분`);
      draw();
      if (time > LIMIT) { api.fail(`모두 건너기 전에 ${time}분이 지나 등불이 꺼졌습니다. 17분 이내에 건너야 해요.`); reset(); draw(); return; }
      if (Object.values(side).every(v => v === 1)) { done = true; setTimeout(api.solve, 450); }
    }
  });
  draw();
}

function mountSlide(el, api) {
  const START = [[2, 0, 2, 1], [1, 5, 3, 0], [5, 2, 2, 1], [2, 3, 2, 0], [2, 2, 2, 0], [5, 0, 2, 1], [0, 4, 2, 0], [3, 0, 2, 0], [0, 0, 3, 1], [4, 2, 2, 1], [3, 4, 2, 0]];
  let B, moves, done = false;
  const reset = () => { B = START.map(([r, c, l, h]) => ({ r, c, l, h: !!h })); moves = 0; };
  reset();
  el.innerHTML = `<div class="slide-wrap"><div class="slide-board" data-board></div><div class="exit" aria-hidden="true">출구</div></div>
    <div class="work-foot"><span>이동 <b data-n>0</b>번</span><button class="btn btn-ghost btn-sm" data-r>처음부터</button></div>`;
  const board = el.querySelector("[data-board]"), COL = ["c1", "c2", "c3", ""];
  const place = (d, b) => { d.style.left = (b.c * 100 / 6) + "%"; d.style.top = (b.r * 100 / 6) + "%"; d.style.width = ((b.h ? b.l : 1) * 100 / 6) + "%"; d.style.height = ((b.h ? 1 : b.l) * 100 / 6) + "%"; };
  function build() {
    board.innerHTML = "";
    B.forEach((b, i) => {
      const d = document.createElement("div");
      d.className = `blk ${b.h ? "h" : "v"} ${i === 0 ? "target" : COL[i % 4]}`;
      d.tabIndex = 0; d.dataset.i = i; d.setAttribute("role", "button");
      d.setAttribute("aria-label", i === 0 ? "빨간 우편선 (가로)" : `${b.h ? "가로" : "세로"} 배 ${i}`);
      d.innerHTML = i === 0 ? "<i>우편</i>" : "<i></i>";
      place(d, b); board.appendChild(d);
    });
    el.querySelector("[data-n]").textContent = moves;
  }
  function grid(except) {
    const g = Array.from({ length: 6 }, () => Array(6).fill(-1));
    B.forEach((b, i) => { if (i === except) return; for (let k = 0; k < b.l; k++) g[b.r + (b.h ? 0 : k)][b.c + (b.h ? k : 0)] = i; });
    return g;
  }
  function range(i) {
    const b = B[i], g = grid(i); let lo = 0, hi = 0;
    if (b.h) { while (b.c + lo - 1 >= 0 && g[b.r][b.c + lo - 1] < 0) lo--; while (b.c + b.l + hi < 6 && g[b.r][b.c + b.l + hi] < 0) hi++; }
    else { while (b.r + lo - 1 >= 0 && g[b.r + lo - 1][b.c] < 0) lo--; while (b.r + b.l + hi < 6 && g[b.r + b.l + hi][b.c] < 0) hi++; }
    return [lo, hi];
  }
  function commit(i, steps, d) {
    if (!steps) return;
    const b = B[i]; if (b.h) b.c += steps; else b.r += steps;
    moves++; el.querySelector("[data-n]").textContent = moves; place(d, b);
    if (i === 0 && b.c + b.l === 6) { done = true; setTimeout(() => d.classList.add("out"), 40); setTimeout(api.solve, 700); }
  }
  board.addEventListener("pointerdown", e => {
    const d = e.target.closest(".blk"); if (!d || done) return;
    const i = +d.dataset.i, b = B[i], [lo, hi] = range(i), cell = board.clientWidth / 6, sx = e.clientX, sy = e.clientY;
    let off = 0;
    d.setPointerCapture(e.pointerId); d.classList.add("drag");
    const mv = ev => { const raw = b.h ? ev.clientX - sx : ev.clientY - sy; off = Math.max(lo * cell, Math.min(hi * cell, raw)); d.style.transform = b.h ? `translateX(${off}px)` : `translateY(${off}px)`; };
    const up = () => {
      d.removeEventListener("pointermove", mv); d.removeEventListener("pointerup", up); d.removeEventListener("pointercancel", up);
      d.style.transform = ""; commit(i, Math.round(off / cell), d);
      requestAnimationFrame(() => d.classList.remove("drag"));
      d.focus({ preventScroll: true });
    };
    d.addEventListener("pointermove", mv); d.addEventListener("pointerup", up); d.addEventListener("pointercancel", up);
    e.preventDefault();
  });
  board.addEventListener("keydown", e => {
    const d = e.target.closest(".blk"); if (!d || done) return;
    const i = +d.dataset.i, b = B[i];
    const dir = b.h ? (e.key === "ArrowLeft" ? -1 : e.key === "ArrowRight" ? 1 : 0) : (e.key === "ArrowUp" ? -1 : e.key === "ArrowDown" ? 1 : 0);
    if (!dir) return;
    e.preventDefault();
    const [lo, hi] = range(i);
    if ((dir < 0 && lo < 0) || (dir > 0 && hi > 0)) commit(i, dir, d);
  });
  el.querySelector("[data-r]").addEventListener("click", () => { if (done) return; reset(); build(); });
  build();
}
const MOUNTS = { lights: mountLights, matches: mountMatches, river: mountRiver, bridge: mountBridge, slide: mountSlide };

/* =========================================================
   EVENTS
   ========================================================= */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-act]");
  if (!t || t.getAttribute("aria-disabled") === "true" && t.dataset.act !== "open-loc") return;
  const a = t.dataset.act, id = t.dataset.id;
  switch (a) {
    case "start":
      if (!S.started) { S.started = true; save(); }
      if (!S.introSeen) { go("map"); showIntro(); } else go("map");
      break;
    case "intro-done": S.introSeen = true; save(); closeSheet(); break;
    case "go-title": go("title"); break;
    case "go-map": if (!S.started) { S.started = true; save(); } go("map"); break;
    case "go-notebook": go("notebook"); break;
    case "nb-back": go(S.started ? "map" : "title"); break;
    case "open-loc": {
      const l = locById[id];
      if (!isOpen(l)) { toast(`퍼즐을 ${l.need - solvedN()}개 더 풀면 ${l.name}이(가) 열립니다.`); break; }
      go("place", { loc: id }); break;
    }
    case "open-pz": {
      const from = ui.screen === "notebook" || ui.screen === "answer" ? ui.screen : "place";
      closeSheet(); openPuzzle(+id, null, from); break;
    }
    case "tile": openTile(+id); break;
    case "answer": closeSheet(); go("answer", { pz: +id }); break;
    case "filter": ui.filter = t.dataset.f; renderNotebook(); break;
    case "pz-back": leavePuzzle(); break;
    case "close-sheet": closeSheet(); break;
    case "submit": if (PZ && PZ.submit && !PZ.solved) PZ.submit(); break;
    case "hints": if (PZ) openHints(); break;
    case "unlock-hint": {
      const st = ps(PZ.p.id);
      if (coinsN() < 1 || st.hints >= 3) break;
      st.hints++; save(); refreshStats();
      const dots = app.querySelector("[data-hintdots]"); if (dots) dots.innerHTML = hintDots();
      openHints(); break;
    }
    case "memo": memo ? closeMemo() : openMemo(); break;
    case "memo-pen": if (memo) { memo.tool = "pen"; memo.color = t.dataset.c; drawActionbar(); } break;
    case "memo-eraser": if (memo) { memo.tool = "eraser"; drawActionbar(); } break;
    case "memo-clear": if (memo) { memo.strokes.length = 0; memo.redraw(); } break;
    case "after-solve": {
      const first = t.dataset.first === "1", p = PZ && PZ.p;
      closeSheet();
      if (first && p && p.id === 15 && !S.endingSeen) go("ending");
      else leavePuzzle();
      break;
    }
    case "reset":
      openSheet(`<h2>진행 기록을 지울까요?</h2><p class="muted" style="margin-top:6px">푼 퍼즐, 점수, 찾은 코인이 모두 사라지고 되돌릴 수 없습니다.</p>
        <div class="sheet-actions"><button class="btn btn-ghost" data-act="close-sheet">취소</button><button class="btn btn-danger" data-act="reset-yes">기록 지우기</button></div>`);
      break;
    case "reset-yes": S = blank(); save(); closeSheet(); go("title"); toast("진행 기록을 지웠습니다."); break;
  }
});
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && sheetEl && sheetEl._dismiss) { closeSheet(); return; }
  if ((e.key === "Enter" || e.key === " ") && e.target.matches && e.target.matches('.pin[role="button"]')) { e.preventDefault(); e.target.dispatchEvent(new MouseEvent("click", { bubbles: true })); return; }
  if (sheetEl || memo || ui.screen !== "puzzle" || !PZ || PZ.solved || PZ.p.type !== "number") return;
  if (/^[0-9]$/.test(e.key)) { pressKey(e.key); e.preventDefault(); }
  else if (e.key === "Backspace") { pressKey("back"); e.preventDefault(); }
  else if (e.key === "Enter" && !(e.target.closest && e.target.closest("button"))) { PZ.submit && PZ.submit(); e.preventDefault(); }
});

/* =========================================================
   BOOT
   ========================================================= */
function boot(data) {
  try {
    if (data && data.screen && ["title", "map", "place", "notebook", "answer", "puzzle"].includes(data.screen)) {
      Object.assign(ui, { screen: data.screen, loc: data.loc || null, pz: data.pz || null, replay: !!data.replay, from: data.from || "place", filter: data.filter || "all" });
    }
  } catch (e) { }
  render();
  initCloud();
}
try { window.claude && window.claude.hot && window.claude.hot.snapshot && window.claude.hot.snapshot(() => ({ screen: ui.screen, loc: ui.loc, pz: ui.pz, replay: ui.replay, from: ui.from, filter: ui.filter })); } catch (e) { }
if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot);
else boot(window.claude && window.claude.hot && window.claude.hot.data || {});
</script>
